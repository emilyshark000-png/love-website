<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do U Love Me? ♡</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(255,210,230,.7), transparent 28%),
    linear-gradient(135deg, #fff0f7, #eee9ff);
}

.card {
  position: relative;
  z-index: 2;
  width: min(650px, 92vw);
  padding: 38px 28px;
  text-align: center;
  background: rgba(255,255,255,.86);
  border: 3px solid #f4b8d2;
  border-radius: 34px;
  box-shadow: 0 20px 60px rgba(130,80,120,.18);
}

h1 {
  margin: 0 0 10px;
  color: #d34e87;
  font-size: clamp(31px, 6vw, 52px);
}

#message {
  min-height: 38px;
  margin-bottom: 18px;
  color: #79556a;
  font-size: 22px;
}

#cats {
  width: min(300px, 75vw);
  height: 300px;
  object-fit: cover;
  border-radius: 25px;
  border: 4px solid #ffc1d9;
  box-shadow: 0 10px 25px rgba(190,100,145,.2);
  display: none;
  margin: 12px auto 22px;
}

.buttons {
  min-height: 90px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 15px 29px;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .18s ease, opacity .18s ease;
}

#yes {
  color: white;
  background: #ff78ab;
  box-shadow: 0 7px 18px rgba(255,120,171,.3);
}

#no {
  color: #665b64;
  background: #e8e1e7;
}

#final {
  display: none;
  color: #d34e87;
  font-size: 31px;
  font-weight: 900;
}

.decoration {
  position: fixed;
  z-index: 1;
  pointer-events: none;
  user-select: none;
  animation: drift 5s ease-in-out infinite;
}

.d1 { top: 4%; left: 4%; font-size: 34px; }
.d2 { top: 10%; right: 6%; font-size: 38px; animation-delay: .7s; }
.d3 { top: 38%; left: 2%; font-size: 31px; animation-delay: 1.4s; }
.d4 { top: 47%; right: 2%; font-size: 32px; animation-delay: 2.1s; }
.d5 { bottom: 5%; left: 6%; font-size: 40px; animation-delay: 1.1s; }
.d6 { bottom: 8%; right: 7%; font-size: 35px; animation-delay: 2.6s; }
.d7 { top: 2%; left: 43%; font-size: 25px; animation-delay: .3s; }
.d8 { bottom: 3%; left: 43%; font-size: 28px; animation-delay: 1.8s; }
.d9 { top: 25%; right: 12%; font-size: 23px; animation-delay: 3s; }
.d10 { bottom: 23%; left: 12%; font-size: 25px; animation-delay: 2.5s; }

@keyframes drift {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
}
</style>
</head>

<body>
<!-- feathers, doves, and flowers only ♡ -->
<div class="decoration d1">🪶 🌸</div>
<div class="decoration d2">🕊️ 🌷</div>
<div class="decoration d3">🌸 🪶</div>
<div class="decoration d4">🕊️ 🌺</div>
<div class="decoration d5">🌷 🪶</div>
<div class="decoration d6">🕊️ 🌸</div>
<div class="decoration d7">🪶</div>
<div class="decoration d8">🌸 🪶</div>
<div class="decoration d9">🕊️</div>
<div class="decoration d10">🌷</div>

  <div class="buttons" id="buttons">
    <button id="yes">YES 💗</button>
    <button id="no">NO 😭</button>
  </div>

  <div id="final">i love you too!! ♡ 🕊️</div>

<script>
let percent = 0;
let noScale = 1;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const title = document.getElementById("title");
const message = document.getElementById("message");
const cats = document.getElementById("cats");
const final = document.getElementById("final");
const buttons = document.getElementById("buttons");

yes.addEventListener("click", () => {
  if (percent < 100) {
    percent++;
    message.textContent = "u love me " + percent + "% 💗";
    yes.textContent = percent < 100 ? "YES 💗" : "100% ♡";
    yes.style.transform = `scale(${1 + percent * 0.0015})`;
  }

  if (percent === 100) {
    title.textContent = "100%!! ♡";
    message.style.display = "none";
    cats.style.display = "block";
    buttons.style.display = "none";
    final.style.display = "block";
  }
});

no.addEventListener("click", () => {
  noScale *= 0.72;
  no.style.transform = `scale(${noScale})`;

  if (noScale > 0.12) {
    message.textContent = "u love me " + percent + "%... right? 🕊️";
  } else if (noScale > 0.04) {
    message.textContent = "the NO is getting tiny... 🪶";
  } else {
    no.disabled = true;
    no.style.opacity = "0.15";
    message.textContent = "NO has entered the microscopic realm. 🌸";
  }
});
</script>
